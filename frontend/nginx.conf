server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not record expense IDs, filters, or request data in access logs.
    access_log off;
    error_log /dev/stderr crit;
    # Go enforces the documented 1 MiB limit and returns the JSON error envelope.
    client_max_body_size 0;

    location = /api {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://app:8080;
        # Includes the browser's original port, required by Go's Origin check.
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
