services:
  app:
    build: .
    environment:
      DATABASE_URL: "postgres://finbot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/finbot?sslmode=disable"
      HTTP_ADDR: ":8080"
    ports:
      - "${HTTP_BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s
  db:
    image: postgres:17-alpine
    # Constraint errors must not log SQL statements or DETAIL with expense rows.
    command: ["postgres", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_DB: finbot
      POSTGRES_USER: finbot
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbot -d finbot"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
